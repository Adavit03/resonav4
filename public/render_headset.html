<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Resona VR Headset Studio Render</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #container {
      width: 1400px;
      height: 900px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.170.0",
        "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const width = 1400;
    const height = 900;
    const container = document.getElementById('container');

    const scene = new THREE.Scene();
    scene.background = null; // Transparent background

    const camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 50);
    // Dynamic 3/4 hero camera position
    camera.position.set(2.8, 1.25, 2.5);
    camera.lookAt(0, 0.08, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(2.0); // Ultra-sharp 2800x1800
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Studio Lighting
    // 1. Soft Warm Hemisphere Fill
    const hemiLight = new THREE.HemisphereLight('#fef7ec', '#181b22', 2.2);
    scene.add(hemiLight);

    // 2. Main Key Light (Broad soft studio softbox above-front right)
    const keyLight = new THREE.DirectionalLight('#ffffff', 4.2);
    keyLight.position.set(4.5, 6.0, 4.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.radius = 4;
    scene.add(keyLight);

    // 3. Subtle Fill Light (Gentle warm left fill)
    const fillLight = new THREE.DirectionalLight('#fff2de', 2.2);
    fillLight.position.set(-3.5, 2.5, 3.5);
    scene.add(fillLight);

    // 4. Cool Spatial Audio Accent Rim Light (Soft cyan/blue backlight)
    const rimLight = new THREE.DirectionalLight('#38bdf8', 2.8);
    rimLight.position.set(-5.0, 4.0, -4.0);
    scene.add(rimLight);

    // 5. Overhead Soft Top Wash for Headband definition
    const topLight = new THREE.DirectionalLight('#ffffff', 2.2);
    topLight.position.set(0, 7.0, 0);
    scene.add(topLight);

    // Soft Contact Shadow Plane directly beneath the headset
    const shadowGeo = new THREE.PlaneGeometry(12, 12);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.65 });
    const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -0.875;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // Load Headset Model
    const loader = new GLTFLoader();
    loader.load('/assets/resona/Models/Resona_VR_Headset_Concept.glb', (gltf) => {
      const headset = gltf.scene;

      headset.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.geometry.computeVertexNormals();

          const name = child.name;

          if (name.includes('Main_silver_visor_shell')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#dce2ea',
              metalness: 0.88,
              roughness: 0.24,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Obsidian_front_visor')) {
            child.material = new THREE.MeshPhysicalMaterial({
              color: '#080a0e',
              metalness: 0.94,
              roughness: 0.07,
              clearcoat: 1.0,
              clearcoatRoughness: 0.04,
              reflectivity: 0.95,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Lower_shell_lip')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#252830',
              metalness: 0.75,
              roughness: 0.38,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Blue_status_light')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#00e5ff',
              emissive: new THREE.Color('#00e5ff'),
              emissiveIntensity: 3.5,
              roughness: 0.08,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Face_gasket') || name.includes('Nose_relief')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#15171b',
              roughness: 0.96,
              metalness: 0.02,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Side_hinge')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#c2c8d2',
              metalness: 0.92,
              roughness: 0.16,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Audio_cup_inner')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#121418',
              roughness: 0.94,
              metalness: 0.0,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Audio_cup')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#1b1d24',
              metalness: 0.70,
              roughness: 0.30,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Rear_headband') || name.includes('Top_support')) {
            if (name.includes('end')) {
              child.material = new THREE.MeshStandardMaterial({
                color: '#9aa2b0',
                metalness: 0.85,
                roughness: 0.22,
                side: THREE.DoubleSide,
              });
            } else {
              child.material = new THREE.MeshStandardMaterial({
                color: '#20242c',
                roughness: 0.75,
                metalness: 0.35,
                side: THREE.DoubleSide,
              });
            }
          } else if (name.includes('Resona_side_accent')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#d3bc91', // Resona Signature Champagne Gold
              metalness: 0.92,
              roughness: 0.18,
              side: THREE.DoubleSide,
            });
          } else if (name.includes('Vent')) {
            child.material = new THREE.MeshStandardMaterial({
              color: '#0f1115',
              roughness: 0.9,
              metalness: 0.2,
              side: THREE.DoubleSide,
            });
          }
        }
      });

      headset.position.set(0, -0.04, 0);
      headset.rotation.set(-0.06, 0.62, 0.04);
      scene.add(headset);

      renderer.render(scene, camera);
      window.__RENDER_DONE__ = true;
      console.log('RENDER_COMPLETE');
    }, undefined, (err) => {
      console.error('Model load error:', err);
    });
  </script>
</body>
</html>
